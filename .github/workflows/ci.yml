name: MVP verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: repair-guide-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Progress records and Markdown references
        run: |
          python scripts/check_progress.py
          python -m unittest discover -s scripts/tests -p "test_check_progress.py"
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run types
          git diff --exit-code src/api/generated/schema.ts
          npx playwright install --with-deps chromium
      - name: Isolated PostgreSQL migration and regression tests
        run: |
          dc() { docker compose -p repair-guide-test --env-file .env.example --env-file .env.test.example -f compose.yaml -f compose.test.yaml "$@"; }
          dc build api web
          dc up -d --wait db
          docker compose -p repair-guide-test --env-file .env.example --env-file .env.test.example -f compose.yaml -f compose.test.yaml -f compose.admin.yaml run --rm api python -m alembic upgrade head
          dc run --rm api python -m ruff check app tests
          dc run --rm api python -m pytest -q -p no:cacheprovider
          dc run --rm api python -m scripts.export_openapi --check
          docker compose -p repair-guide-test --env-file .env.example --env-file .env.test.example -f compose.yaml -f compose.test.yaml -f compose.admin.yaml run --rm api python -m alembic check
      - name: Encrypted pg_dump restore drill
        run: |
          docker build -f backend/Dockerfile.ops -t repair-guide-ops backend
          mkdir -p artifacts/m11
          docker run --rm --network repair-guide-test_default --env PYTHONPATH=/app --env APP_ENV=test --env DATABASE_URL=postgresql+psycopg://postgres:local-admin-development-only@db:5432/repair_guide_test --volume "$PWD/scripts:/app/drills:ro" --volume "$PWD/artifacts/m11:/drill" --entrypoint python repair-guide-ops /app/drills/drill_backup.py
      - name: Actual catalog, browser flows and accessibility (OpenAI OFF)
        run: |
          docker compose -p repair-guide-test --env-file .env.example --env-file .env.test.example -f compose.yaml -f compose.test.yaml run --rm api python -m app.commands.catalog publish /data/catalog/m08a-20261004/catalog.json
          docker compose -p repair-guide-test --env-file .env.example --env-file .env.test.example -f compose.yaml -f compose.test.yaml -f compose.e2e.yaml up -d --no-build --wait
          npm --prefix frontend run test:e2e
      - name: Concurrent API and fault drills
        run: |
          python -m pip install httpx==0.28.1
          python scripts/load_api.py
          python scripts/drill_outage.py
      - name: Save verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            artifacts/m11/report.json
            artifacts/m11/load-report.json
            artifacts/m11/outage-report.json
            artifacts/playwright
          retention-days: 7
      - name: Stop isolated stack
        if: always()
        run: docker compose -p repair-guide-test --env-file .env.example --env-file .env.test.example -f compose.yaml -f compose.test.yaml -f compose.e2e.yaml down
