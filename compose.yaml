name: repair-guide
services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      APP_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
      - ./docker/db/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      WEB_ORIGINS: ${WEB_ORIGINS:-["http://localhost:8080"]}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.4-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      AUTH_TTL_HOURS: ${AUTH_TTL_HOURS:-24}
      QUESTION_RETENTION_YEARS: ${QUESTION_RETENTION_YEARS:-5}
      MEMBER_RESULT_RETENTION_YEARS: ${MEMBER_RESULT_RETENTION_YEARS:-5}
      RAW_RECORD_GRACE_DAYS: ${RAW_RECORD_GRACE_DAYS:-7}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      DELETION_LOG_RETENTION_DAYS: ${DELETION_LOG_RETENTION_DAYS:-15}
      SURVEY_TIMEOUT_SECONDS: ${SURVEY_TIMEOUT_SECONDS:-10}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-25}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
volumes:
  database:
  caddy-data:
  caddy-config:
