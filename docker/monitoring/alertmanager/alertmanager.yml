route:
  receiver: local
  group_by: [alertname, check, task]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local

inhibit_rules:
  - source_matchers: ['alertname="RepairReadinessDown"']
    target_matchers: ['alertname=~"RepairCatalogNotReady|RepairRagNotReady"']
    equal: [instance]
